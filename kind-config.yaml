kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mini-cluster
networking:
  apiServerPort: 37337
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /mnt/hdd1/projects/mini-ml-stack
        containerPath: /mnt/project
      - hostPath: /dev/null
        containerPath: /var/run/nvidia-container-devices/all
